name: Deploy server-project-sf-go through express233

on:
  push:
    branches: [main, master]
    tags: ["v*"]

# Copy this file into poke-game/server-project-sf-go/.gitea/workflows/ after
# configuring the three repository secrets listed below. It runs only on the
# private production runner supplied by deploy/gitea.
jobs:
  build-upload-deploy:
    runs-on: express233-ci
    env:
      EXPRESS233_URL: ${{ secrets.EXPRESS233_URL }}
      EXPRESS233_USERNAME: ${{ secrets.EXPRESS233_USERNAME }}
      EXPRESS233_PASSWORD: ${{ secrets.EXPRESS233_PASSWORD }}
      PROJECT: server-project-sf-go
      # A tag is an explicit release number. A branch build intentionally sends
      # an empty name so express233 allocates the next patch atomically.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      VCS_COMMIT: ${{ github.sha }}
      VCS_REF: ${{ github.ref }}
      VCS_RUN_ID: ${{ github.run_id }}
      VCS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build all Go main packages
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t mains < <(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          test "${#mains[@]}" -gt 0
          for pkg in "${mains[@]}"; do
            name=$(basename "$pkg")
            export GOOS=linux GOARCH=amd64
            CGO_ENABLED=0 go build -trimpath -o "dist/${name}-linux-amd64" "$pkg"
          done
      - name: Upload immutable version and deploy logic-111
        run: |
          set -euo pipefail
          : "${EXPRESS233_URL:?missing EXPRESS233_URL secret}"
          : "${EXPRESS233_USERNAME:?missing EXPRESS233_USERNAME secret}"
          : "${EXPRESS233_PASSWORD:?missing EXPRESS233_PASSWORD secret}"
          BASE="${EXPRESS233_URL%/}"
          JAR=$(mktemp)
          trap 'rm -f "$JAR" /tmp/server-project-sf-go.tar.gz' EXIT
          # Login via HttpOnly cookie. This avoids exposing the credential in a
          # command line or relying on a forwarded Authorization header.
          login_payload=$(python3 -c 'import json,os; print(json.dumps({"username":os.environ["EXPRESS233_USERNAME"],"password":os.environ["EXPRESS233_PASSWORD"]}))')
          curl --fail --silent --show-error -c "$JAR" -H 'Content-Type: application/json' \
            -X POST "$BASE/api/login" \
            -d "$login_payload" >/dev/null
          project_id=$(curl --fail --silent --show-error -b "$JAR" "$BASE/api/projects" | python3 -c 'import json,os,sys; print(next((str(p["id"]) for p in json.load(sys.stdin) if p["name"] == os.environ["PROJECT"]), ""))')
          if [ -z "$project_id" ]; then
            project_payload=$(python3 -c 'import json,os; print(json.dumps({"name":os.environ["PROJECT"]}))')
            project=$(curl --fail --silent --show-error -b "$JAR" -H 'Content-Type: application/json' \
              -X POST "$BASE/api/projects" -d "$project_payload")
            project_id=$(printf '%s' "$project" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          version_payload=$(python3 -c 'import json,os; print(json.dumps({"name":os.environ["VERSION"],"vcs":{"provider":"gitea","repository":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"],"ref":os.environ["VCS_REF"],"commit":os.environ["VCS_COMMIT"],"run_id":os.environ["VCS_RUN_ID"],"run_url":os.environ["VCS_RUN_URL"]}}))')
          version_result=$(curl --fail --silent --show-error -b "$JAR" -H 'Content-Type: application/json' \
            -X POST "$BASE/api/projects/$project_id/versions" -d "$version_payload")
          VERSION=$(printf '%s' "$version_result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          export VERSION
          tar --format=pax --numeric-owner --exclude-vcs --exclude='.gitea' --exclude='node_modules' --exclude='./.deploy' -czf /tmp/server-project-sf-go.tar.gz .
          curl --fail --silent --show-error -b "$JAR" -F "file=@/tmp/server-project-sf-go.tar.gz" \
            "$BASE/api/projects/$project_id/versions/$VERSION/files" >/dev/null
          curl --fail --silent --show-error -b "$JAR" -X POST \
            "$BASE/api/projects/$project_id/versions/$VERSION/publish" >/dev/null
          deployment_payload=$(python3 -c 'import json,os; print(json.dumps({"version":os.environ["VERSION"],"server_ids":["111"],"tags":["prod","logic","aliyun"],"tag_match":"all"}))')
          deployment=$(curl --fail --silent --show-error -b "$JAR" -H 'Content-Type: application/json' -X POST \
            "$BASE/api/projects/$project_id/push-deployments" \
            -d "$deployment_payload")
          deployment_id=$(printf '%s' "$deployment" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for _ in $(seq 1 120); do
            result=$(curl --fail --silent --show-error -b "$JAR" "$BASE/api/projects/$project_id/push-deployments/$deployment_id")
            status=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" = queued ] || [ "$status" = running ] || break
            sleep 2
          done
          printf '%s\n' "$result"
          test "$status" = success

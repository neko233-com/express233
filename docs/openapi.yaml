openapi: 3.0.3
info:
  title: express233-server API
  description: |
    游戏服务器集群推/拉一体交付控制平面 API。

    - **管理端**：Cookie 会话（`POST /api/login`）或 HTTP Basic Auth（初始化可用 `root/root`）
    - **节点端**：拉取 Token（下载使用 `token` 查询参数；Agent 心跳使用 `X-Express233-Token` 请求头）或 HTTP Basic Auth
  version: 1.0.0
servers:
  - url: http://localhost:23380
    description: 本地开发

tags:
  - name: health
  - name: auth
  - name: admin
  - name: projects
  - name: pull
  - name: analytics
  - name: agent
  - name: ssh
  - name: deployment
  - name: delivery

paths:
  /healthz:
    get:
      tags: [health]
      summary: 健康检查
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 成功，Set-Cookie 会话
        "401":
          $ref: "#/components/responses/Error"

  /api/me:
    get:
      tags: [auth]
      summary: 当前用户
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: OK

  /api/server-ids:
    get:
      tags: [admin]
      summary: 列出 server.yaml 中 server_id
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_ids:
                    type: array
                    items: { type: string }

  /api/servers:
    get:
      tags: [admin]
      summary: 列出 server.yaml 中的服务器条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerEntryEnvelope"

  /api/servers/{serverID}:
    get:
      tags: [admin]
      summary: 获取单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerEntryEnvelope"
    put:
      tags: [admin]
      summary: 创建或更新单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerEntry"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerEntryEnvelope"
    delete:
      tags: [admin]
      summary: 删除单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      responses:
        "204":
          description: 已删除

  /api/server-yaml:
    get:
      tags: [admin]
      summary: 读取 server.yaml
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
    put:
      tags: [admin]
      summary: 保存 server.yaml（仅管理员）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        "204":
          description: 已保存

  /api/deploy/preview:
    get:
      tags: [admin]
      summary: 预览 server_id 配置变更（可预览草稿版本）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          description: 变更预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewReport"

  /api/deploy/diff:
    get:
      tags: [admin]
      summary: 对比两版本在 server_id 下的有效配置差异
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/project"
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffReport"

  /api/projects:
    get:
      tags: [projects]
      summary: 项目列表
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: 创建项目；同名且有写权限时返回已有项目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: 已存在，返回已有项目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /api/projects/{id}/versions:
    get:
      tags: [projects]
      summary: 版本列表
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
    post:
      tags: [projects]
      summary: 创建草稿版本；未指定 name 时自动生成下一个 patch 版本
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 版本号；留空则自动创建 0.0.1 或当前最大三段数字版本 patch + 1 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/projects/{id}/versions/{ver}/submit-review:
    post:
      tags: [projects]
      summary: 提交审批（draft/rejected → pending_review）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已进入待审批

  /api/projects/{id}/versions/{ver}/reject:
    post:
      tags: [projects]
      summary: 驳回审批（pending_review → rejected，仅 admin）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已驳回

  /api/projects/{id}/versions/{ver}/publish:
    post:
      tags: [projects]
      summary: 正式发布（不可再改，仅 admin；允许 draft 或 pending_review）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已发布

  /api/projects/{id}/versions/{ver}/files:
    post:
      tags: [projects]
      summary: 上传单文件或 zip/tar/tar.gz/tgz 整包（自动解压）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  description: 可选相对路径
                tags:
                  type: array
                  items: { type: string }
                  description: 可选文件标签；空或省略表示 *
      responses:
        "200":
          description: 已上传

  /api/projects/{id}/versions/{ver}/file-tags:
    get:
      tags: [projects]
      summary: 列出版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionFileTag"
    put:
      tags: [projects]
      summary: 设置单个版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTagRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFileTag"
    delete:
      tags: [projects]
      summary: 清空单个文件标签为 *
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 已清空

  /api/projects/{id}/versions/{ver}/file-tags/batch:
    post:
      tags: [projects]
      summary: 批量设置/追加/移除/清空版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTagBatchRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionFileTag"

  /api/pull:
    get:
      tags: [pull]
      summary: 拉取已发布版本（tar.gz）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/server_id"
        - name: version
          in: query
          schema: { type: string }
          description: 省略则取最新已发布
        - name: os
          in: query
          schema: { type: string }
          description: 下载方 OS，例如 linux/windows/darwin；新版 CLI 默认自动上报
        - name: arch
          in: query
          schema: { type: string }
          description: 下载方架构，例如 amd64/arm64；新版 CLI 默认自动上报
        - name: tags
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: 额外选择标签，可重复传递
      responses:
        "200":
          description: application/gzip 包
          content:
            application/gzip:
              schema:
                type: string
                format: binary

  /api/pull/preview:
    get:
      tags: [pull]
      summary: 预览配置变更（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/server_id"
        - name: version
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewReport"

  /api/pull/diff:
    get:
      tags: [pull]
      summary: 对比两版本配置差异（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffReport"

  /api/pull/server-ids:
    get:
      tags: [pull]
      summary: 列出 server_id（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_ids:
                    type: array
                    items: { type: string }

  /api/pull/versions:
    get:
      tags: [pull]
      summary: 列出项目已发布版本
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Version"

  /api/agent/capabilities:
    get:
      tags: [agent]
      summary: 发现 Agent 可操作的 HTTP API
      description: 返回认证方式、凭据策略和部署 Agent 的完整能力清单。
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: Agent 能力清单

  /api/push/hosts:
    get:
      tags: [ssh]
      summary: SSH 主机列表（永不返回凭据）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushHost" }
    post:
      tags: [ssh]
      summary: 创建 SSH 主机并加密保存凭据
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushHostRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHost" }
        "400": { $ref: "#/components/responses/Error" }

  /api/push/hosts/{hostID}:
    parameters:
      - { name: hostID, in: path, required: true, schema: { type: integer } }
    get:
      tags: [ssh]
      summary: 获取 SSH 主机（永不返回凭据）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHost" }
    put:
      tags: [ssh]
      summary: 更新 SSH 主机；凭据留空表示保持原值
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushHostRequest" }
      responses:
        "204": { description: 已更新 }
    delete:
      tags: [ssh]
      summary: 删除 SSH 主机和关联绑定/检查历史
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204": { description: 已删除 }

  /api/push/hosts/{hostID}/check:
    post:
      tags: [ssh]
      summary: 执行一次 SSH 存活检查
      description: 仅发起一次 TCP 连接和 SSH 握手；失败不会重试，等待下一配置周期。
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHostCheck" }

  /api/push/hosts/{hostID}/checks:
    get:
      tags: [ssh]
      summary: 查询 SSH 存活检查历史
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushHostCheck" }

  /api/push/hosts/{hostID}/servers:
    get:
      tags: [ssh]
      summary: 查询主机的 server_id 绑定
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushServerBinding" }
    post:
      tags: [ssh]
      summary: 创建 server_id 与远程部署根目录绑定
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushServerBindingRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushServerBinding" }

  /api/projects/{id}/push-deployments:
    get:
      tags: [deployment]
      summary: 查询项目 SSH 发布记录
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 发布记录列表 }
    post:
      tags: [deployment]
      summary: 串行部署选中的 SSH 节点
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                server_ids: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                tag_match: { type: string, enum: [all, any], default: all }
                dry_run: { type: boolean, default: false }
      responses:
        "201": { description: 已创建发布任务 }

  /api/projects/{id}/push-tasks:
    get:
      tags: [deployment]
      summary: 查询项目的可重复发布任务
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PushDeploymentTask" } }
    post:
      tags: [deployment]
      summary: 创建可重复发布任务
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeploymentTaskRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeploymentTask" }

  /api/projects/{id}/push-tasks/{taskID}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: taskID, in: path, required: true, schema: { type: integer } }
    get:
      tags: [deployment]
      summary: 获取可重复发布任务
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeploymentTask" }
    put:
      tags: [deployment]
      summary: 更新可重复发布任务
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeploymentTaskRequest" }
      responses:
        "204": { description: 已更新 }
    delete:
      tags: [deployment]
      summary: 删除任务定义（历史执行日志不受影响）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204": { description: 已删除任务定义 }

  /api/projects/{id}/push-tasks/{taskID}/run:
    post:
      tags: [deployment]
      summary: 重复执行发布任务并生成不可变日志快照
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: 可选的单次版本覆盖 }
                dry_run: { type: boolean, default: false }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeployment" }

  /api/projects/{id}/release-hooks:
    get:
      tags: [hooks]
      summary: 查询项目的版本发布 Hook
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReleaseHook" } }
    post:
      tags: [hooks]
      summary: 创建可启停的版本发布 Hook
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseHookRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseHook" }

  /api/projects/{id}/release-hooks/{hookID}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: hookID, in: path, required: true, schema: { type: integer } }
    put:
      tags: [hooks]
      summary: 更新或启停 Hook；停用时取消尚未派发的等待任务
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseHookRequest" }
      responses:
        "204": { description: 已更新 }
    delete:
      tags: [hooks]
      summary: 删除 Hook 定义，30 天事件历史不删除
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204": { description: 已删除 }

  /api/projects/{id}/release-hooks/{hookID}/trigger:
    post:
      tags: [hooks]
      summary: 手动或由 CI 触发 Hook
      description: 使用持久化尾随防抖；窗口内再次调用会将执行时间顺延，并只派发一次最新版本。
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: hookID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: 为空时使用最新已发布版本 }
                source: { type: string, default: manual }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseHook" }

  /api/projects/{id}/release-hook-events:
    get:
      tags: [hooks]
      summary: 查询 Hook 触发、合并及派发记录（保留 30 天）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 100 } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReleaseHookEvent" } }

  /metrics:
    get:
      tags: [health]
      summary: Prometheus 指标
      responses:
        "200":
          description: text/plain metrics

  /api/status:
    get:
      tags: [admin]
      summary: 系统状态摘要
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: OK

  /api/dashboard:
    get:
      tags: [analytics]
      summary: 按天汇总上传、发布、拉取与 SSH 发布记录
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 30 }
        - name: project_id
          in: query
          description: 可选；只能选择当前用户可访问的项目
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
        "400":
          $ref: "#/components/responses/Error"

  /api/audit-logs:
    get:
      tags: [admin]
      summary: 操作审计（管理员）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: 审计列表

  /api/projects/{id}/versions/{ver}/validate:
    get:
      tags: [projects]
      summary: 发布前检查
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ver, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 检查结果

  /api/projects/{id}/versions/{ver}/download:
    get:
      tags: [projects]
      summary: 下载已发布版本原始包
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ver, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: application/gzip

  /api/agent/nodes/heartbeat:
    post:
      tags: [delivery]
      summary: Pull Agent 注册、心跳、应用确认与期望状态获取
      security: [{ pullTokenHeader: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryHeartbeat"
      responses:
        "200":
          description: 当前节点和期望状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  node: { $ref: "#/components/schemas/DeliveryNode" }
                  desired: { $ref: "#/components/schemas/DeliveryDesired" }
        "401": { $ref: "#/components/responses/Error" }

  /api/agent/guide:
    get:
      tags: [agent]
      summary: 列出公开、脱敏的官方接入指南目录
      description: 不需要认证；绝不返回账号、Token、SSH、服务器、项目、日志或运行态数据。
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGuideIndex"

  /api/agent/guide/{topic}:
    get:
      tags: [agent]
      summary: 读取公开、脱敏的官方接入指南主题
      parameters:
        - { name: topic, in: path, required: true, schema: { type: string, enum: [overview, agent, gitea, github, security] } }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGuideTopic"
        "404": { $ref: "#/components/responses/Error" }

  /api/projects/{id}/delivery-nodes:
    get:
      tags: [delivery]
      summary: 统一列出 Push SSH 绑定和 Pull Agent 节点
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliveryNodeView" }

  /api/projects/{id}/delivery-nodes/{serverID}/desired:
    put:
      tags: [delivery]
      summary: 设置 Pull 节点期望版本和自动跟随策略
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: "#/components/parameters/server_id_path"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: 必须是已发布版本 }
                auto_follow: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryNode" }

  /api/projects/{id}/delivery-nodes/{serverID}:
    delete:
      tags: [delivery]
      summary: 删除 Pull 节点控制面状态（下次心跳可重新注册）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: "#/components/parameters/server_id_path"
      responses:
        "204": { description: 已删除 }

  /api/me/password:
    post:
      tags: [auth]
      summary: 修改当前用户密码
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204":
          description: 已更新

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: express233_session
    basicAuth:
      type: http
      scheme: basic
    pullTokenHeader:
      type: apiKey
      in: header
      name: X-Express233-Token
  parameters:
    token:
      name: token
      in: query
      required: true
      schema: { type: string }
    project:
      name: project
      in: query
      required: true
      schema: { type: string }
    version:
      name: version
      in: query
      required: true
      schema: { type: string }
    server_id:
      name: server_id
      in: query
      required: true
      schema: { type: string }
    server_id_path:
      name: serverID
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    PushHost:
      type: object
      description: SSH 凭据字段刻意不属于响应模型。
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        port: { type: integer }
        username: { type: string }
        auth_mode: { type: string, enum: [private_key, password, agent] }
        host_key: { type: string }
        host_key_fingerprint: { type: string }
        health_check_enabled: { type: boolean }
        health_check_interval_seconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
        last_check_at: { type: string }
        last_check_status: { type: string, enum: [unknown, ok, failed] }
        last_check_error: { type: string }
        last_check_latency_ms: { type: integer, format: int64 }
        next_check_at: { type: string }
    PushHostRequest:
      type: object
      required: [name, address, username, auth_mode]
      properties:
        name: { type: string }
        address: { type: string }
        port: { type: integer, default: 22 }
        username: { type: string }
        auth_mode: { type: string, enum: [private_key, password, agent] }
        credential: { type: string, format: password, writeOnly: true }
        host_key: { type: string }
        health_check_enabled: { type: boolean, default: true }
        health_check_interval_seconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
    PushHostCheck:
      type: object
      properties:
        id: { type: integer }
        host_id: { type: integer }
        status: { type: string, enum: [ok, failed] }
        error: { type: string }
        latency_ms: { type: integer, format: int64 }
        trigger: { type: string, enum: [manual, scheduled] }
        checked_at: { type: string }
    PushServerBinding:
      allOf:
        - $ref: "#/components/schemas/PushServerBindingRequest"
        - type: object
          properties:
            id: { type: integer }
            host_id: { type: integer }
            host_name: { type: string }
    PushServerBindingRequest:
      type: object
      required: [server_id, remote_root]
      properties:
        server_id: { type: string }
        labels: { type: string, default: test }
        content_tags: { type: string }
        remote_root: { type: string }
        os: { type: string, default: linux }
        arch: { type: string, default: amd64 }
    PushDeploymentTaskRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: string, description: 为空表示每次执行时取最新已发布版本 }
        server_ids: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, default: [test] }
        tag_match: { type: string, enum: [all, any], default: all }
    PushDeploymentTask:
      allOf:
        - $ref: "#/components/schemas/PushDeploymentTaskRequest"
        - type: object
          properties:
            id: { type: integer }
            project_id: { type: integer }
            run_count: { type: integer, format: int64 }
            last_run_at: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    PushDeployment:
      type: object
      description: 不可变的任务执行快照，保留 30 天且不支持手动删除。
      properties:
        id: { type: integer }
        project_id: { type: integer }
        task_id: { type: integer }
        task_name: { type: string }
        hook_event_id: { type: integer, description: Hook 派发幂等键；非 Hook 发布为 0 }
        version: { type: string }
        selector: { type: string, description: 执行时 server_ids、tags、tag_match 的 JSON 快照 }
        status: { type: string, enum: [queued, running, success, failed] }
        created_at: { type: string }
    ReleaseHookRequest:
      type: object
      required: [name, task_id]
      properties:
        name: { type: string, maxLength: 100 }
        task_id: { type: integer }
        enabled: { type: boolean, default: true }
        debounce_seconds: { type: integer, minimum: 1, maximum: 3600, default: 30 }
    ReleaseHook:
      allOf:
        - $ref: "#/components/schemas/ReleaseHookRequest"
        - type: object
          properties:
            id: { type: integer }
            project_id: { type: integer }
            task_name: { type: string }
            pending_version: { type: string }
            pending_source: { type: string }
            pending_since: { type: string }
            due_at: { type: string }
            pending_events: { type: integer, format: int64 }
            trigger_count: { type: integer, format: int64 }
            merge_count: { type: integer, format: int64 }
            run_count: { type: integer, format: int64 }
            last_deployment_id: { type: integer, format: int64 }
            last_status: { type: string }
            last_error: { type: string }
    ReleaseHookEvent:
      type: object
      description: 不含账号密码、Token、SSH 凭据或版本包内容。
      properties:
        id: { type: integer }
        hook_id: { type: integer }
        hook_name: { type: string }
        kind: { type: string, enum: [trigger, dispatch] }
        source: { type: string }
        version: { type: string }
        status: { type: string, enum: [scheduled, merged, running, success, failed, cancelled] }
        merged_events: { type: integer, format: int64 }
        deployment_id: { type: integer, format: int64 }
        deployment_status: { type: string }
        detail: { type: string }
        created_at: { type: string }
        completed_at: { type: string }
    DashboardSnapshot:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        days: { type: integer }
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        health:
          $ref: "#/components/schemas/DashboardHealth"
        series:
          type: array
          items: { $ref: "#/components/schemas/DashboardDay" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/DashboardRecord" }
    DashboardSummary:
      type: object
      properties:
        uploads: { type: integer }
        upload_failures: { type: integer }
        upload_bytes: { type: integer, format: int64 }
        uploaded_files: { type: integer }
        publishes: { type: integer }
        pulls: { type: integer }
        pull_failures: { type: integer }
        pull_success_rate: { type: number, format: double }
        deployments: { type: integer }
        deployment_successes: { type: integer }
        deployment_failures: { type: integer }
        deployment_success_rate: { type: number, format: double }
        targets: { type: integer }
        target_failures: { type: integer }
        average_deployment_millis: { type: integer, format: int64 }
    DashboardHealth:
      type: object
      description: 当前拓扑和自动化状态快照；非按日历史指标。
      properties:
        pull_nodes: { type: integer }
        pull_online: { type: integer }
        pull_drift: { type: integer }
        ssh_hosts: { type: integer }
        ssh_healthy: { type: integer }
        ssh_failing: { type: integer }
        ssh_unknown: { type: integer }
        hooks_enabled: { type: integer }
        hooks_pending: { type: integer }
        hook_failures: { type: integer }
        latest_event_at: { type: string }
    DashboardDay:
      type: object
      properties:
        date: { type: string, format: date }
        uploads: { type: integer }
        upload_failures: { type: integer }
        upload_bytes: { type: integer, format: int64 }
        uploaded_files: { type: integer }
        publishes: { type: integer }
        pulls: { type: integer }
        pull_failures: { type: integer }
        deployments: { type: integer }
        deployment_successes: { type: integer }
        deployment_failures: { type: integer }
        targets: { type: integer }
        target_failures: { type: integer }
    DashboardRecord:
      type: object
      properties:
        at: { type: string }
        kind: { type: string, enum: [upload, publish, pull, deploy] }
        project_id: { type: integer }
        project: { type: string }
        version: { type: string }
        status: { type: string }
        actor: { type: string }
        server_id: { type: string }
        bytes: { type: integer, format: int64 }
        files: { type: integer }
        detail: { type: string }
    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
    DeliveryHeartbeat:
      type: object
      required: [project, server_id, status, heartbeat_interval_seconds]
      properties:
        project: { type: string }
        server_id: { type: string }
        role: { type: string }
        environment: { type: string }
        labels: { type: array, items: { type: string } }
        os: { type: string }
        arch: { type: string }
        current_version: { type: string }
        applied_generation: { type: integer, format: int64 }
        status: { type: string, enum: [ok, deploying, error] }
        error_code: { type: string, description: 仅机器可读安全标识；禁止上传原始日志或凭据 }
        heartbeat_interval_seconds: { type: integer, minimum: 10, maximum: 3600 }
    AgentGuideIndex:
      type: object
      properties:
        title: { type: string }
        notice: { type: string }
        api_path: { type: string }
        topics:
          type: array
          items: { $ref: "#/components/schemas/AgentGuideTopic" }
    AgentGuideTopic:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        content: { type: string, description: 仅在单主题读取时返回；静态 Markdown 文本。 }
    DeliveryDesired:
      type: object
      properties:
        version: { type: string }
        generation: { type: integer, format: int64 }
        needs_deploy: { type: boolean }
    DeliveryNode:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        server_id: { type: string }
        delivery_mode: { type: string, enum: [pull] }
        role: { type: string }
        environment: { type: string }
        labels: { type: array, items: { type: string } }
        current_version: { type: string }
        desired_version: { type: string }
        desired_generation: { type: integer, format: int64 }
        applied_generation: { type: integer, format: int64 }
        auto_follow: { type: boolean }
        status: { type: string }
        last_seen_at: { type: string }
    DeliveryNodeView:
      type: object
      properties:
        id: { type: string, example: "pull:42" }
        delivery_mode: { type: string, enum: [push, pull] }
        server_id: { type: string }
        role: { type: string }
        environment: { type: string }
        labels: { type: array, items: { type: string } }
        os: { type: string }
        arch: { type: string }
        current_version: { type: string }
        desired_version: { type: string }
        desired_generation: { type: integer, format: int64 }
        applied_generation: { type: integer, format: int64 }
        auto_follow: { type: boolean }
        status: { type: string }
        online: { type: boolean }
        drift: { type: boolean }
        host_id: { type: integer, format: int64 }
        host_name: { type: string }
    Version:
      type: object
      properties:
        version: { type: string }
        status: { type: string, enum: [draft, pending_review, rejected, published] }
        created_at: { type: string }
        published_at: { type: string }
    VersionFileTag:
      type: object
      properties:
        path: { type: string }
        tags:
          type: array
          items: { type: string }
          example: ["linux-amd64", "linux"]
    FileTagRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        tags:
          type: array
          items: { type: string }
          description: 空数组表示 *
    FileTagBatchRequest:
      type: object
      properties:
        paths:
          type: array
          items: { type: string }
        patterns:
          type: array
          items: { type: string }
          description: glob，例如 bin/windows/** 或 *.exe
        tags:
          type: array
          items: { type: string }
        mode:
          type: string
          enum: [set, add, remove, clear]
    ServerEntry:
      type: object
      properties:
        replacements:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        post_hook: { type: string }
        post_hook_env:
          type: object
          additionalProperties:
            type: string
    ServerEntryEnvelope:
      type: object
      properties:
        server_id: { type: string }
        entry:
          $ref: "#/components/schemas/ServerEntry"
    VersionDiffReport:
      type: object
      properties:
        project: { type: string }
        from_version: { type: string }
        to_version: { type: string }
        server_id: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              basename: { type: string }
              keys:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    from: { type: string }
                    to: { type: string }
                    change: { type: string, enum: [added, removed, modified] }
    PreviewReport:
      type: object
      properties:
        project: { type: string }
        version: { type: string }
        server_id: { type: string }
        post_hook: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              basename: { type: string }
              paths:
                type: array
                items: { type: string }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    before: { type: string }
                    after: { type: string }
                    action: { type: string, enum: [replace, add, unchanged] }

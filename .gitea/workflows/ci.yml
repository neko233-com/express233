name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# This label is intentionally private to the production act_runner defined in
# deploy/gitea. It pins Go 1.26 and Node 24 rather than inheriting whatever is
# installed on a shared runner.
jobs:
  package:
    name: package all binaries
    runs-on: express233-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build console and verified binaries
        env:
          VERSION: 0.0.0-ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/neko233-com/express233/internal/version.Version=${VERSION} -X github.com/neko233-com/express233/internal/version.Commit=${COMMIT}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""; [ "$GOOS" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "dist/express233-cli-${GOOS}-${GOARCH}${ext}" ./cmd/express233-cli
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "dist/express233-server-${GOOS}-${GOARCH}${ext}" ./cmd/express233-server
          done
          sha256sum dist/* > dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS

name: Build Express233 console
description: Build the Vite+ assets before compiling the Go server
inputs:
  check:
    description: Run frontend lint and type checks before building
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - shell: bash
      run: npm --prefix frontend ci
    - if: inputs.check == 'true'
      shell: bash
      run: npm --prefix frontend run check
    - shell: bash
      run: npm --prefix frontend run build

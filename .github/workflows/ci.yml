name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React console
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build signed metadata binaries
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || 'ci' }}
        run: |
          LDFLAGS="-s -w \
            -X github.com/neko233-com/express233/internal/version.Version=${VERSION} \
            -X github.com/neko233-com/express233/internal/version.Commit=${COMMIT} \
            -X github.com/neko233-com/express233/internal/version.Date=${DATE}"
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""
            [ "$GOOS" = windows ] && ext=.exe
            env CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "${LDFLAGS}" -o "bin/express233-cli-${GOOS}-${GOARCH}${ext}" ./cmd/express233-cli
            env CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "${LDFLAGS}" -o "bin/express233-server-${GOOS}-${GOARCH}${ext}" ./cmd/express233-server
          done
          # Keep source identity next to every downloadable binary. The same
          # fields are also exposed by `version` at runtime and are safe to
          # import into an express233 artifact provenance record.
          python3 - <<'PY' > bin/PROVENANCE.json
          import json, os
          print(json.dumps({
              "schema": "express233.artifact-provenance/v1",
              "version": os.environ["VERSION"],
              "repository": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit": os.environ["COMMIT"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }, sort_keys=True))
          PY
          sha256sum bin/* > bin/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: express233-binaries
          path: bin/

name: Headless browser verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "test/browser/**"
      - "frontend/**"
      - "internal/api/static.go"
      - ".github/actions/build-console/**"
      - ".github/workflows/visual-e2e.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CGO_ENABLED: "0"

jobs:
  browser:
    name: console flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-console
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Agent Browser CLI
        run: npm --prefix test/browser ci --ignore-scripts
      - name: Install Chrome if unavailable
        run: command -v google-chrome || npm --prefix test/browser run install-browser
      - name: Verify packaged console headlessly
        run: npm --prefix test/browser run verify

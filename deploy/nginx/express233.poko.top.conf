server {
    listen 80;
    listen [::]:80;
    server_name express233.poko.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name express233.poko.top;

    # Replace only if your existing certificate location differs.
    ssl_certificate /etc/letsencrypt/live/express233.poko.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/express233.poko.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:23380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

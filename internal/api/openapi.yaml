openapi: 3.0.3
info:
  title: express233-server API
  description: |
    游戏逻辑服拉模式部署中央服务 API。

    - **管理端**：Cookie 会话（`POST /api/login`）或 HTTP Basic Auth（初始化可用 `root/root`）
    - **节点端**：拉取 Token（`token` 查询参数）
  version: 1.0.0
servers:
  - url: http://localhost:23380
    description: 本地开发

tags:
  - name: health
  - name: auth
  - name: admin
  - name: projects
  - name: pull
  - name: analytics
  - name: agent
  - name: ssh
  - name: deployment

paths:
  /healthz:
    get:
      tags: [health]
      summary: 健康检查
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 成功，Set-Cookie 会话
        "401":
          $ref: "#/components/responses/Error"

  /api/me:
    get:
      tags: [auth]
      summary: 当前用户
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: OK

  /api/server-ids:
    get:
      tags: [admin]
      summary: 列出 server.yaml 中 server_id
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_ids:
                    type: array
                    items: { type: string }

  /api/servers:
    get:
      tags: [admin]
      summary: 列出 server.yaml 中的服务器条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerEntryEnvelope"

  /api/servers/{serverID}:
    get:
      tags: [admin]
      summary: 获取单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerEntryEnvelope"
    put:
      tags: [admin]
      summary: 创建或更新单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerEntry"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerEntryEnvelope"
    delete:
      tags: [admin]
      summary: 删除单个 server_id 条目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/server_id_path"
      responses:
        "204":
          description: 已删除

  /api/server-yaml:
    get:
      tags: [admin]
      summary: 读取 server.yaml
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
    put:
      tags: [admin]
      summary: 保存 server.yaml（仅管理员）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        "204":
          description: 已保存

  /api/deploy/preview:
    get:
      tags: [admin]
      summary: 预览 server_id 配置变更（可预览草稿版本）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          description: 变更预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewReport"

  /api/deploy/diff:
    get:
      tags: [admin]
      summary: 对比两版本在 server_id 下的有效配置差异
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/project"
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffReport"

  /api/projects:
    get:
      tags: [projects]
      summary: 项目列表
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: 创建项目；同名且有写权限时返回已有项目
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: 已存在，返回已有项目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /api/projects/{id}/versions:
    get:
      tags: [projects]
      summary: 版本列表
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
    post:
      tags: [projects]
      summary: 创建草稿版本；未指定 name 时自动生成下一个 patch 版本
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 版本号；留空则自动创建 0.0.1 或当前最大三段数字版本 patch + 1 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/projects/{id}/versions/{ver}/submit-review:
    post:
      tags: [projects]
      summary: 提交审批（draft/rejected → pending_review）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已进入待审批

  /api/projects/{id}/versions/{ver}/reject:
    post:
      tags: [projects]
      summary: 驳回审批（pending_review → rejected，仅 admin）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已驳回

  /api/projects/{id}/versions/{ver}/publish:
    post:
      tags: [projects]
      summary: 正式发布（不可再改，仅 admin；允许 draft 或 pending_review）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已发布

  /api/projects/{id}/versions/{ver}/files:
    post:
      tags: [projects]
      summary: 上传单文件或 zip/tar/tar.gz/tgz 整包（自动解压）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  description: 可选相对路径
                tags:
                  type: array
                  items: { type: string }
                  description: 可选文件标签；空或省略表示 *
      responses:
        "200":
          description: 已上传

  /api/projects/{id}/versions/{ver}/file-tags:
    get:
      tags: [projects]
      summary: 列出版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionFileTag"
    put:
      tags: [projects]
      summary: 设置单个版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTagRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFileTag"
    delete:
      tags: [projects]
      summary: 清空单个文件标签为 *
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 已清空

  /api/projects/{id}/versions/{ver}/file-tags/batch:
    post:
      tags: [projects]
      summary: 批量设置/追加/移除/清空版本文件标签
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: ver
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTagBatchRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionFileTag"

  /api/pull:
    get:
      tags: [pull]
      summary: 拉取已发布版本（tar.gz）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/server_id"
        - name: version
          in: query
          schema: { type: string }
          description: 省略则取最新已发布
        - name: os
          in: query
          schema: { type: string }
          description: 下载方 OS，例如 linux/windows/darwin；新版 CLI 默认自动上报
        - name: arch
          in: query
          schema: { type: string }
          description: 下载方架构，例如 amd64/arm64；新版 CLI 默认自动上报
        - name: tags
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: 额外选择标签，可重复传递
      responses:
        "200":
          description: application/gzip 包
          content:
            application/gzip:
              schema:
                type: string
                format: binary

  /api/pull/preview:
    get:
      tags: [pull]
      summary: 预览配置变更（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/server_id"
        - name: version
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewReport"

  /api/pull/diff:
    get:
      tags: [pull]
      summary: 对比两版本配置差异（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/server_id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffReport"

  /api/pull/server-ids:
    get:
      tags: [pull]
      summary: 列出 server_id（节点 token）
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_ids:
                    type: array
                    items: { type: string }

  /api/pull/versions:
    get:
      tags: [pull]
      summary: 列出项目已发布版本
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Version"

  /api/agent/capabilities:
    get:
      tags: [agent]
      summary: 发现 Agent 可操作的 HTTP API
      description: 返回认证方式、凭据策略和部署 Agent 的完整能力清单。
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: Agent 能力清单

  /api/push/hosts:
    get:
      tags: [ssh]
      summary: SSH 主机列表（永不返回凭据）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushHost" }
    post:
      tags: [ssh]
      summary: 创建 SSH 主机并加密保存凭据
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushHostRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHost" }
        "400": { $ref: "#/components/responses/Error" }

  /api/push/hosts/{hostID}:
    parameters:
      - { name: hostID, in: path, required: true, schema: { type: integer } }
    get:
      tags: [ssh]
      summary: 获取 SSH 主机（永不返回凭据）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHost" }
    put:
      tags: [ssh]
      summary: 更新 SSH 主机；凭据留空表示保持原值
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushHostRequest" }
      responses:
        "204": { description: 已更新 }
    delete:
      tags: [ssh]
      summary: 删除 SSH 主机和关联绑定/检查历史
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204": { description: 已删除 }

  /api/push/hosts/{hostID}/check:
    post:
      tags: [ssh]
      summary: 执行一次 SSH 存活检查
      description: 仅发起一次 TCP 连接和 SSH 握手；失败不会重试，等待下一配置周期。
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushHostCheck" }

  /api/push/hosts/{hostID}/checks:
    get:
      tags: [ssh]
      summary: 查询 SSH 存活检查历史
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushHostCheck" }

  /api/push/hosts/{hostID}/servers:
    get:
      tags: [ssh]
      summary: 查询主机的 server_id 绑定
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushServerBinding" }
    post:
      tags: [ssh]
      summary: 创建 server_id 与远程部署根目录绑定
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: hostID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushServerBindingRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushServerBinding" }

  /api/projects/{id}/push-deployments:
    get:
      tags: [deployment]
      summary: 查询项目 SSH 发布记录
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 发布记录列表 }
    post:
      tags: [deployment]
      summary: 串行部署选中的 SSH 节点
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                server_ids: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                tag_match: { type: string, enum: [all, any], default: all }
                dry_run: { type: boolean, default: false }
      responses:
        "201": { description: 已创建发布任务 }

  /metrics:
    get:
      tags: [health]
      summary: Prometheus 指标
      responses:
        "200":
          description: text/plain metrics

  /api/status:
    get:
      tags: [admin]
      summary: 系统状态摘要
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: OK

  /api/dashboard:
    get:
      tags: [analytics]
      summary: 按天汇总上传、发布、拉取与 SSH 发布记录
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: project_id
          in: query
          description: 可选；只能选择当前用户可访问的项目
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
        "400":
          $ref: "#/components/responses/Error"

  /api/audit-logs:
    get:
      tags: [admin]
      summary: 操作审计（管理员）
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: 审计列表

  /api/projects/{id}/versions/{ver}/validate:
    get:
      tags: [projects]
      summary: 发布前检查
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ver, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 检查结果

  /api/projects/{id}/versions/{ver}/download:
    get:
      tags: [projects]
      summary: 下载已发布版本原始包
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: ver, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: application/gzip

  /api/me/password:
    post:
      tags: [auth]
      summary: 修改当前用户密码
      security: [{ cookieAuth: [] }, { basicAuth: [] }]
      responses:
        "204":
          description: 已更新

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: express233_session
    basicAuth:
      type: http
      scheme: basic
  parameters:
    token:
      name: token
      in: query
      required: true
      schema: { type: string }
    project:
      name: project
      in: query
      required: true
      schema: { type: string }
    version:
      name: version
      in: query
      required: true
      schema: { type: string }
    server_id:
      name: server_id
      in: query
      required: true
      schema: { type: string }
    server_id_path:
      name: serverID
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    PushHost:
      type: object
      description: SSH 凭据字段刻意不属于响应模型。
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        port: { type: integer }
        username: { type: string }
        auth_mode: { type: string, enum: [private_key, password, agent] }
        host_key: { type: string }
        host_key_fingerprint: { type: string }
        health_check_enabled: { type: boolean }
        health_check_interval_seconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
        last_check_at: { type: string }
        last_check_status: { type: string, enum: [unknown, ok, failed] }
        last_check_error: { type: string }
        last_check_latency_ms: { type: integer, format: int64 }
        next_check_at: { type: string }
    PushHostRequest:
      type: object
      required: [name, address, username, auth_mode]
      properties:
        name: { type: string }
        address: { type: string }
        port: { type: integer, default: 22 }
        username: { type: string }
        auth_mode: { type: string, enum: [private_key, password, agent] }
        credential: { type: string, format: password, writeOnly: true }
        host_key: { type: string }
        health_check_enabled: { type: boolean, default: true }
        health_check_interval_seconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
    PushHostCheck:
      type: object
      properties:
        id: { type: integer }
        host_id: { type: integer }
        status: { type: string, enum: [ok, failed] }
        error: { type: string }
        latency_ms: { type: integer, format: int64 }
        trigger: { type: string, enum: [manual, scheduled] }
        checked_at: { type: string }
    PushServerBinding:
      allOf:
        - $ref: "#/components/schemas/PushServerBindingRequest"
        - type: object
          properties:
            id: { type: integer }
            host_id: { type: integer }
            host_name: { type: string }
    PushServerBindingRequest:
      type: object
      required: [server_id, remote_root]
      properties:
        server_id: { type: string }
        labels: { type: string, default: test }
        content_tags: { type: string }
        remote_root: { type: string }
        os: { type: string, default: linux }
        arch: { type: string, default: amd64 }
    DashboardSnapshot:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        days: { type: integer }
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        series:
          type: array
          items: { $ref: "#/components/schemas/DashboardDay" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/DashboardRecord" }
    DashboardSummary:
      type: object
      properties:
        uploads: { type: integer }
        upload_failures: { type: integer }
        upload_bytes: { type: integer, format: int64 }
        uploaded_files: { type: integer }
        publishes: { type: integer }
        pulls: { type: integer }
        pull_failures: { type: integer }
        pull_success_rate: { type: number, format: double }
        deployments: { type: integer }
        deployment_successes: { type: integer }
        deployment_failures: { type: integer }
        deployment_success_rate: { type: number, format: double }
        targets: { type: integer }
        target_failures: { type: integer }
        average_deployment_millis: { type: integer, format: int64 }
    DashboardDay:
      type: object
      properties:
        date: { type: string, format: date }
        uploads: { type: integer }
        upload_failures: { type: integer }
        upload_bytes: { type: integer, format: int64 }
        uploaded_files: { type: integer }
        publishes: { type: integer }
        pulls: { type: integer }
        pull_failures: { type: integer }
        deployments: { type: integer }
        deployment_successes: { type: integer }
        deployment_failures: { type: integer }
        targets: { type: integer }
        target_failures: { type: integer }
    DashboardRecord:
      type: object
      properties:
        at: { type: string }
        kind: { type: string, enum: [upload, publish, pull, deploy] }
        project_id: { type: integer }
        project: { type: string }
        version: { type: string }
        status: { type: string }
        actor: { type: string }
        server_id: { type: string }
        bytes: { type: integer, format: int64 }
        files: { type: integer }
        detail: { type: string }
    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
    Version:
      type: object
      properties:
        version: { type: string }
        status: { type: string, enum: [draft, pending_review, rejected, published] }
        created_at: { type: string }
        published_at: { type: string }
    VersionFileTag:
      type: object
      properties:
        path: { type: string }
        tags:
          type: array
          items: { type: string }
          example: ["linux-amd64", "linux"]
    FileTagRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        tags:
          type: array
          items: { type: string }
          description: 空数组表示 *
    FileTagBatchRequest:
      type: object
      properties:
        paths:
          type: array
          items: { type: string }
        patterns:
          type: array
          items: { type: string }
          description: glob，例如 bin/windows/** 或 *.exe
        tags:
          type: array
          items: { type: string }
        mode:
          type: string
          enum: [set, add, remove, clear]
    ServerEntry:
      type: object
      properties:
        replacements:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        post_hook: { type: string }
        post_hook_env:
          type: object
          additionalProperties:
            type: string
    ServerEntryEnvelope:
      type: object
      properties:
        server_id: { type: string }
        entry:
          $ref: "#/components/schemas/ServerEntry"
    VersionDiffReport:
      type: object
      properties:
        project: { type: string }
        from_version: { type: string }
        to_version: { type: string }
        server_id: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              basename: { type: string }
              keys:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    from: { type: string }
                    to: { type: string }
                    change: { type: string, enum: [added, removed, modified] }
    PreviewReport:
      type: object
      properties:
        project: { type: string }
        version: { type: string }
        server_id: { type: string }
        post_hook: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              basename: { type: string }
              paths:
                type: array
                items: { type: string }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    before: { type: string }
                    after: { type: string }
                    action: { type: string, enum: [replace, add, unchanged] }
